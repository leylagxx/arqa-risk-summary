# Семантическая модель кредитного портфеля (уровень кредита).
# Источник — очищенная витрина: дубли убраны, суммы в тенге по курсу на дату среза,
# списанные кредиты исключены. Все суммовые меры аддитивны по любым измерениям.
#
# Доли (PAR30, NPL и т. п.) здесь сознательно не заводятся мерами: в формате есть только
# sum/avg/count, а среднее по кредитам от флага дало бы долю по числу кредитов, а не по сумме.
# Доля = отношение двух sum-мер (например, par30_kzt / portfolio_kzt) — её считает слой
# отчёта, либо берите готовые доли из модели portfolio_metrics.

model: portfolio
label: Кредитный портфель
source: reporting.v_portfolio
grain: [report_date, loan_id]   # одна строка = кредит на дату среза

dimensions:
  - name: report_date
    column: report_date
    type: date
    label: Дата среза
  - name: loan_id
    column: loan_id
    type: string
    label: Кредит
  - name: borrower_id
    column: borrower_id
    type: string
    label: Заёмщик
  - name: group_id
    column: group_id
    type: string
    label: Группа связанных заёмщиков
  - name: sector
    column: sector
    type: string
    label: Отрасль
  - name: program
    column: program
    type: string
    label: Программа
  - name: currency
    column: currency
    type: string
    label: Валюта кредита
  - name: dpd_bucket
    column: dpd_bucket
    type: string
    label: Корзина просрочки
  - name: provision_category
    column: provision_category
    type: string
    label: Категория провизий
  - name: is_restructured
    column: is_restructured
    type: boolean
    label: Реструктуризирован
  - name: is_npl
    column: is_npl
    type: boolean
    label: NPL
  - name: is_past_maturity
    column: is_past_maturity
    type: boolean
    label: Срок погашения прошёл
  - name: issue_date
    column: issue_date
    type: date
    label: Дата выдачи
  - name: maturity_date
    column: maturity_date
    type: date
    label: Дата погашения

measures:
  - name: portfolio_kzt
    column: principal_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель, ₸
  - name: par30_kzt
    column: par30_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 30 дней, ₸
  - name: par90_kzt
    column: par90_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 90 дней, ₸
  - name: npl_kzt
    column: npl_kzt
    type: sum
    format: "#,##0 ₸"
    label: NPL (> 90 дней или реструктуризация), ₸
  - name: provisions_kzt
    column: provision_kzt
    type: sum
    format: "#,##0 ₸"
    label: Провизии, ₸
  - name: loans
    column: loan_id
    type: count
    format: "#,##0"
    label: Число кредитов
  - name: avg_dpd
    column: dpd
    type: avg
    format: "0.0"
    label: Средняя просрочка, дней (по числу кредитов)
